<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#111827"
  >

  <meta
    name="description"
    content="PWA Test 3 - Google Apps Script"
  >

  <link
    rel="manifest"
    href="./manifest.json"
  >

  <title>PWA Test 3</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: grid;
      place-items: center;

      font-family: Arial, sans-serif;

      background: #f5f7fa;
    }

    .card {

      width: min(92%, 420px);

      padding: 30px;

      background: white;

      border-radius: 20px;

      box-shadow:
        0 10px 30px rgba(0,0,0,.08);

      text-align: center;
    }

    h1 {
      margin-top: 0;
    }

    .status {

      margin: 14px 0;

      padding: 14px;

      border-radius: 12px;

      background: #f1f3f5;

      word-break: break-word;
    }

    .ok {
      background: #e9f7ef;
    }

    .bad {
      background: #fdecec;
    }

    button {

      width: 100%;

      padding: 14px;

      border: 0;

      border-radius: 12px;

      background: #111827;

      color: white;

      font-size: 16px;

      cursor: pointer;

      margin-top: 10px;
    }

    button:active {
      transform: scale(.98);
    }

  </style>

</head>


<body>

  <main class="card">

    <h1>PWA Test 3</h1>

    <p>
      PWA → Apps Script → Google Sheets
    </p>


    <div
      id="manifest"
      class="status"
    >
      Manifest: checking...
    </div>


    <div
      id="sw"
      class="status"
    >
      Service Worker: checking...
    </div>


    <div
      id="mode"
      class="status"
    >
      Display mode: checking...
    </div>


    <p id="offline">
      Status jaringan: checking...
    </p>


    <button
      id="apiButton"
      onclick="testAppsScript()"
    >
      Test Google Apps Script
    </button>

    <button
      id="writeButton"
      onclick="writeToSheets()"
    >
      Test Write ke Google Sheets
    </button>
    
    <div
      id="writeResult"
      class="status"
    >
      Write: belum ditest
    </div>

    <button
      id="readButton"
      onclick="readFromSheets()"
    >
      Baca Data dari Google Sheets
    </button>
    
    <div
      id="readResult"
      class="status"
    >
      Read: belum ditest
    </div>
    
    <div
      id="dataContainer"
      style="text-align:left;"
    >
    </div>

    <button
      id="dashboardButton"
      onclick="loadDashboard()"
    >
      Load Dashboard
    </button>
    
    <div
      id="dashboardResult"
      class="status"
    >
      Dashboard: belum dimuat
    </div>
    
    <div
      id="dashboardContainer"
      style="text-align:left;"
    >
    </div>

    <div
      id="apiResult"
      class="status"
    >
      Apps Script: belum ditest
    </div>

  </main>


  <script>

    function setStatus(id, ok, text) {

      const el =
        document.getElementById(id);

      el.textContent = text;

      el.className =
        "status " +
        (ok ? "ok" : "bad");
    }


    async function testManifest() {

      try {

        const response =
          await fetch(
            "./manifest.json",
            {
              cache: "no-store"
            }
          );


        const manifest =
          await response.json();


        const ok =
          !!manifest.name &&
          !!manifest.start_url &&
          !!manifest.icons;


        setStatus(
          "manifest",
          ok,
          ok
            ? "Manifest: OK"
            : "Manifest: ERROR"
        );

      } catch (e) {

        setStatus(
          "manifest",
          false,
          "Manifest: ERROR"
        );

      }

    }


    async function testServiceWorker() {

      if (
        !("serviceWorker" in navigator)
      ) {

        setStatus(
          "sw",
          false,
          "Service Worker: tidak didukung"
        );

        return;
      }


      try {

        const registration =
          await navigator.serviceWorker.register(
            "./service-worker.js"
          );


        await navigator.serviceWorker.ready;


        setStatus(
          "sw",
          true,
          "Service Worker: AKTIF (" +
          registration.scope +
          ")"
        );

      } catch (e) {

        setStatus(
          "sw",
          false,
          "Service Worker: ERROR — " +
          e.message
        );

      }

    }


    function testAppsScript() {

      const result =
        document.getElementById(
          "apiResult"
        );


      result.textContent =
        "Apps Script: connecting...";


      result.className =
        "status";


      const callbackName =
        "pwaCallback_" +
        Date.now();


      window[callbackName] =
        function(data) {

          if (
            data &&
            data.success
          ) {

            result.textContent =
              "Apps Script: CONNECTED | " +
              data.message +
              " | Spreadsheet: " +
              data.spreadsheet;


            result.className =
              "status ok";

          } else {

            result.textContent =
              "Apps Script: ERROR";


            result.className =
              "status bad";

          }


          delete window[callbackName];

          if (script) {
            script.remove();
          }

        };


      const script =
        document.createElement(
          "script"
        );


      script.src =
        "https://script.google.com/macros/s/AKfycbw0iZjYuZctafHmKXDr8TPlT_OJOOlBFQ3AeVd9EY_0TsySNnacWIhJYKeEbuYiA_uU/exec" +
        "?callback=" +
        callbackName;


      script.onerror =
        function() {

          result.textContent =
            "Apps Script: CONNECTION ERROR";


          result.className =
            "status bad";


          delete window[callbackName];

          script.remove();

        };


      document.body.appendChild(
        script
      );

    }

   function writeToSheets() {

  const result =
    document.getElementById("writeResult");


  result.textContent =
    "Write: mengirim data...";

  result.className =
    "status";


  const callbackName =
    "writeCallback_" + Date.now();


  window[callbackName] =
    function(response) {

      if (
        response &&
        response.success &&
        response.data
      ) {

        const data =
          response.data;


        result.textContent =
          "WRITE BERHASIL! " +
          data.message;


        result.className =
          "status ok";

      } else {

        result.textContent =
          "WRITE ERROR: " +
          (
            response &&
            response.message
              ? response.message
              : "Unknown error"
          );


        result.className =
          "status bad";
      }


      delete window[callbackName];


      if (script) {
        script.remove();
      }

    };


  const script =
    document.createElement("script");


  script.src =
    "https://script.google.com/macros/s/AKfycbw0iZjYuZctafHmKXDr8TPlT_OJOOlBFQ3AeVd9EY_0TsySNnacWIhJYKeEbuYiA_uU/exec" +
    "?action=write" +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      result.textContent =
        "WRITE ERROR: Connection error";

      result.className =
        "status bad";

      delete window[callbackName];

      script.remove();

    };


  document.body.appendChild(script);
}

    
    function readFromSheets() {

  const result =
    document.getElementById("readResult");


  const container =
    document.getElementById("dataContainer");


  result.textContent =
    "Read: membaca Google Sheets...";

  result.className =
    "status";


  container.innerHTML =
    "";


  const callbackName =
    "readCallback_" + Date.now();


  window[callbackName] =
    function(response) {

      if (
        response &&
        response.success &&
        response.data
      ) {

        const data =
          response.data;


        const rows =
          data.rows || [];


        const count =
          data.count || 0;


        result.textContent =
          "READ BERHASIL! " +
          "Data berhasil dibaca dari Google Sheets" +
          " | Total: " +
          count;


        result.className =
          "status ok";


        if (rows.length === 0) {

          container.innerHTML =
            "<p>Belum ada data.</p>";

        } else {

          rows.forEach(
            function(row) {

              const item =
                document.createElement("div");


              item.className =
                "status";


              item.innerHTML =
                "<strong>" +
                escapeHtml(
                  row.source
                ) +
                "</strong><br>" +

                escapeHtml(
                  row.message
                ) +
                "<br>" +

                "<small>" +
                escapeHtml(
                  row.timestamp
                ) +
                "</small>";


              container.appendChild(
                item
              );

            }
          );

        }

      } else {

        result.textContent =
          "READ ERROR: " +
          (
            response &&
            response.message
              ? response.message
              : "Unknown error"
          );


        result.className =
          "status bad";
      }


      delete window[callbackName];


      if (script) {
        script.remove();
      }

    };


  const script =
    document.createElement("script");


  script.src =
    "https://script.google.com/macros/s/AKfycbw0iZjYuZctafHmKXDr8TPlT_OJOOlBFQ3AeVd9EY_0TsySNnacWIhJYKeEbuYiA_uU/exec" +
    "?action=read" +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      result.textContent =
        "READ ERROR: Connection error";


      result.className =
        "status bad";


      delete window[callbackName];


      script.remove();

    };


  document.body.appendChild(
    script
  );
}

function escapeHtml(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

    function loadDashboard() {

  const result =
    document.getElementById(
      "dashboardResult"
    );

  const container =
    document.getElementById(
      "dashboardContainer"
    );


  result.textContent =
    "Dashboard: mengambil data...";

  result.className =
    "status";


  container.innerHTML = "";


  const callbackName =
    "dashboardCallback_" +
    Date.now();


  window[callbackName] =
    function(data) {

      if (
        data &&
        data.success &&
        data.data
      ) {

        const dashboard =
          data.data;

        const settings =
          dashboard.settings || {};

        const users =
          dashboard.users || [];


        result.textContent =
          "Dashboard berhasil dimuat";

        result.className =
          "status ok";


        // ==============================
        // APP INFO
        // ==============================

        const appInfo =
          document.createElement("div");

        appInfo.className =
          "status";

        appInfo.innerHTML =
          "<strong>" +
          escapeHtml(
            settings.app_name ||
            "Unknown App"
          ) +
          "</strong><br>" +

          "Version: " +
          escapeHtml(
            settings.app_version ||
            "-"
          ) +
          "<br>" +

          "Maintenance: " +
          escapeHtml(
            String(
              settings.maintenance
            )
          );

        container.appendChild(
          appInfo
        );


        // ==============================
        // USER COUNT
        // ==============================

        const count =
          document.createElement("div");

        count.className =
          "status";

        count.innerHTML =
          "<strong>Users</strong><br>" +
          escapeHtml(
            String(
              dashboard.userCount || 0
            )
          );

        container.appendChild(
          count
        );


        // ==============================
        // USERS
        // ==============================

        users.forEach(
          function(user) {

            const item =
              document.createElement(
                "div"
              );

            item.className =
              "status";

            item.innerHTML =

              "<strong>" +
              escapeHtml(
                user.name
              ) +
              "</strong><br>" +

              escapeHtml(
                user.email
              ) +
              "<br>" +

              "Status: " +
              escapeHtml(
                user.status
              );


            container.appendChild(
              item
            );

          }
        );

      } else {

        result.textContent =
          "Dashboard ERROR: " +
          (
            data &&
            data.message
              ? data.message
              : "Unknown error"
          );

        result.className =
          "status bad";
      }


      delete window[callbackName];


      if (script) {
        script.remove();
      }

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    "https://script.google.com/macros/s/AKfycbw0iZjYuZctafHmKXDr8TPlT_OJOOlBFQ3AeVd9EY_0TsySNnacWIhJYKeEbuYiA_uU/exec" +
    "?action=dashboard" +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      result.textContent =
        "Dashboard ERROR: Connection error";

      result.className =
        "status bad";

      delete window[callbackName];

      script.remove();

    };


  document.body.appendChild(
    script
  );
}

    function testDisplayMode() {

      const standalone =
        window.matchMedia(
          "(display-mode: standalone)"
        ).matches;


      setStatus(
        "mode",
        true,
        standalone
          ? "Display mode: STANDALONE (PWA)"
          : "Display mode: BROWSER"
      );

    }


    function networkStatus() {

      document.getElementById(
        "offline"
      ).textContent =
        "Status jaringan: " +
        (
          navigator.onLine
            ? "ONLINE"
            : "OFFLINE"
        );

    }


    window.addEventListener(
      "online",
      networkStatus
    );


    window.addEventListener(
      "offline",
      networkStatus
    );


    testManifest();

    testServiceWorker();

    testDisplayMode();

    networkStatus();

  </script>

</body>

</html>
